<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vite + React</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: background-color 0.3s, color 0.3s;
      background-color: #f4f4f4;
      color: #333;
    }

    .dark-mode {
      background-color: #121212;
      color: #e0e0e0;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .dark-mode header {
      background-color: #1e1e1e;
    }

    /* Search Section */
    .search-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #eee;
      padding: 0.5rem 1rem;
      border-radius: 20px;
    }

    .search-input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 1rem;
      width: 200px;
      color: inherit;
    }

    .dark-mode .search-container {
      background: #2c2c2c;
    }

    /* Dropdown Region Filter */
    .lll {
      display: none;
      flex-direction: column;
      background: white;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-top: 0.5rem;
      padding: 0.5rem;
    }

    .dark-mode .lll {
      background: #2c2c2c;
      border-color: #444;
    }

    .lll button {
      background: none;
      border: none;
      padding: 0.3rem;
      text-align: left;
      cursor: pointer;
      font-size: 1rem;
      color: inherit;
    }

    .lll button:hover {
      background-color: #f0f0f0;
    }

    .dark-mode .lll button:hover {
      background-color: #3a3a3a;
    }

    /* Toggle region list when active */
    .ll {
      display: flex;
    }

    /* Grid of Countries */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
      padding: 2rem;
    }

    @media (max-width: 1024px) {
      .grid-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }

    /* Country Card */
    .country-card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .country-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
    }

    .dark-mode .country-card {
      background: #1e1e1e;
      color: #fff;
    }

    /* Flag Image */
    .flag-img {
      width: 100%;
      max-width: 250px;
      height: auto;
      transition: transform 0.3s ease;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    }

    /* Enlarged flag in detail view */
    .full-screen .flag-img {
      max-width: 500px;
      transform: scale(1.1);
    }

    /* Full-screen detailed view */
    .full-screen {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .back-button {
      margin: 1rem;
      padding: 0.5rem 1rem;
      background-color: #0077ff;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .back-button:hover {
      background-color: #005fcc;
    }

    .dark-mode .back-button {
      background-color: #2980b9;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
        padding: 1rem;
      }

      .search-container {
        width: 100%;
        padding: 0.5rem 1rem;
        justify-content: space-between;
      }

      .search-input {
        width: 100%;
        font-size: 0.95rem;
      }

      .grid-container {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        padding: 1rem;
        gap: 1rem;
      }

      .country-card {
        font-size: 0.9rem;
      }

      .full-screen {
        padding: 1rem;
        align-items: flex-start;
      }

      .full-screen .flag-img {
        max-width: 100%;
        height: auto;
      }

      .country-info {
        padding: 0.5rem;
        font-size: 0.95rem;
      }

      .back-button {
        width: 100%;
        margin: 1rem 0;
        font-size: 1rem;
      }

      .lll {
        width: 100%;
        position: relative;
      }

      .lll button {
        width: 100%;
        text-align: left;
        padding: 0.5rem 0.8rem;
      }

      button[style*="width: 150px"] {
        width: 100% !important;
        text-align: left;
      }

      h4 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="module">
    import { StrictMode } from "react";
    import { createRoot } from "react-dom/client";
    import React, { useEffect, useState } from "react";
    import { FontAwesomeIcon } from "@fortawesome/react-fontawesome";
    import { faMoon, faSun, faMagnifyingGlass, faArrowUp, faArrowDown } from "@fortawesome/free-solid-svg-icons";

    const App = () => {
      const [data, setData] = useState([]);
      const [themeDark, setThemeDark] = useState(false);
      const [searchText, setSearchText] = useState("");
      const [selectedRegion, setSelectedRegion] = useState("");
      const [showRegionDropdown, setShowRegionDropdown] = useState(false);
      const [selectedCountryIndex, setSelectedCountryIndex] = useState(null);

      useEffect(() => {
        fetch("https://restcountries.com/v2/all")
          .then((res) => res.json())
          .then((countries) => {
            const shuffled = countries.sort(() => Math.random() - 0.5);
            setData(shuffled.slice(0, 300));
          })
          .catch((error) => {
            console.error("Error fetching data:", error);
          });
      }, []);

      const toggleTheme = () => {
        setThemeDark((prev) => !prev);
        document.body.classList.toggle("dark-mode");
      };

      const handleSearch = (e) => {
        setSearchText(e.target.value);
      };

      const toggleRegionDropdown = () => {
        setShowRegionDropdown((prev) => !prev);
      };

      const handleRegionSelect = (region) => {
        setSelectedRegion(region);
        setShowRegionDropdown(false);
      };

      const filteredCountries = data
        .filter((country) => (selectedRegion ? country.region === selectedRegion : true))
        .filter((country) => country.name.toLowerCase().includes(searchText.toLowerCase()));

      const regions = [...new Set(data.map((country) => country.region).filter(Boolean))];

      const fullCountry = (index) => {
        setSelectedCountryIndex(index);
      };

      const goBack = () => {
        setSelectedCountryIndex(null);
      };

      const displayedCountries =
        searchText.trim() !== "" || selectedRegion ? filteredCountries : data;

      const getFlagUrl = (countryCode) => {
        return `https://flagcdn.com/w320/${countryCode.toLowerCase()}.png`;
      };

      return (
        <div>
          <header>
            <h4>Where in the world</h4>

            <button
              onClick={toggleTheme}
              style={{
                width: "60px",
                height: "40px",
                backgroundColor: "transparent",
                border: "none",
                cursor: "pointer",
                fontSize: "20px",
                color: themeDark ? "white" : "black",
              }}
              aria-label="Toggle Theme"
            >
              <FontAwesomeIcon icon={themeDark ? faSun : faMoon} />
            </button>

            <div className="search-container">
              <FontAwesomeIcon icon={faMagnifyingGlass} />
              <input
                type="search"
                placeholder="Search for a country"
                className="search-input"
                value={searchText}
                onChange={handleSearch}
              />
            </div>

            <div style={{ position: "relative" }}>
              <button
                style={{
                  width: "150px",
                  height: "40px",
                  cursor: "pointer",
                  fontSize: "15px",
                }}
                onClick={toggleRegionDropdown}
              >
                Filter by Region{" "}
                <FontAwesomeIcon icon={showRegionDropdown ? faArrowUp : faArrowDown} />
              </button>

              {showRegionDropdown && (
                <div className="region-dropdown">
                  {regions.map((region) => (
                    <button key={region} onClick={() => handleRegionSelect(region)}>
                      {region}
                    </button>
                  ))}
                </div>
              )}
            </div>

            {selectedRegion && (
              <button onClick={() => setSelectedRegion("")} className="clear-region-btn">
                Clear Region Filter
              </button>
            )}
          </header>

          <div className="grid-container">
            {selectedCountryIndex !== null ? (
              <div className="country-card full-screen" key={selectedCountryIndex}>
                <button className="back-button" onClick={goBack}>
                  Back
                </button>
                {(() => {
                  const country = displayedCountries[selectedCountryIndex];
                  if (!country) return null;
                  return (
                    <>
                      <img className="flag-img" src={getFlagUrl(country.alpha2Code)} alt={country.name} />
                      <div className="country-info">
                        <h3>{country.name}</h3>
                        <p>
                          <strong>Subregion:</strong> {country.subregion}
                        </p>
                        <p>
                          <strong>Area:</strong> {country.area?.toLocaleString()} km²
                        </p>
                        <p>
                          <strong>Timezones:</strong> {country.timezones?.join(", ") ?? "N/A"}
                        </p>
                        <p>
                          <strong>Borders:</strong> {country.borders?.join(", ") || "None"}
                        </p>
                        <p>
                          <strong>Native Name:</strong> {country.nativeName}
                        </p>
                        <p>
                          <strong>Calling Codes:</strong> +{country.callingCodes?.join(", +")}
                        </p>
                        <p>
                          <strong>Border Countries:</strong>
                          <ul>
                            {country.borders?.length > 0 ? (
                              country.borders.map((code, idx) => (
                                <li key={idx}>{code}</li>
                              ))
                            ) : (
                              <li>None</li>
                            )}
                          </ul>
                        </p>
                      </div>
                    </>
                  );
                })()}
              </div>
            ) : displayedCountries.length === 0 ? (
              <p style={{ textAlign: "center", marginTop: "2rem" }}>No countries found.</p>
            ) : (
              displayedCountries.map((country, index) => (
                <div
                  className={`country-card item-${index + 1}`}
                  key={index}
                  onClick={() => fullCountry(index)}
                >
                  <img
                    className="flag-img"
                    src={getFlagUrl(country.alpha2Code)}
                    alt={country.name}
                  />
                  <div className="country-info">
                    <h3>{country.name}</h3>
                    <p>
                      <strong>Subregion:</strong> {country.subregion}
                    </p>
                    <p>
                      <strong>Area:</strong> {country.area?.toLocaleString() ?? "N/A"} km²
                    </p>
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    };

    createRoot(document.getElementById("root")).render(
      <StrictMode>
        <App />
      </StrictMode>
    );
  </script>
</body>

</html>
